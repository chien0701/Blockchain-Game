name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json

      - name: 安裝前端套件
        run: npm ci

      - name: 前端測試（任何一項失敗即停止部署）
        run: npm test

      - name: 安裝合約套件
        working-directory: contracts
        run: npm ci

      - name: 合約測試（含前端 random.js ↔ Solidity 一致性、ABI 一致性、安全回歸）
        working-directory: contracts
        run: npx hardhat test

      - name: 編譯專案
        run: npx vite build
        env:
          # 合約地址為公開資訊，不需使用 Secret
          # ⚠️ 重新部署合約後必須同步更新；歷次部署見 contracts/deployments/sepolia.json
          VITE_CONTRACT_ADDRESS: "0xe9C2a98699FEd3653774783160e65556f7B6aDB3"
          VITE_FAIRBET_ADDRESS: "0xb798377B9bE67114f9302dfB6e9cC8A7Bf2c402c"
          VITE_CHAIN_ID: "11155111"

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
